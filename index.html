<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Show Explorer</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- Axios CDN -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="js/script.js" defer></script>
</head>
<body>
  <header>
    <h1>TV Show Explorer</h1>
    <p>Search and discover your favorite TV series!</p>
  </header>

  <main>
    <!-- Search Section -->
    <section class="search-section" aria-labelledby="search-heading">
      <h2 id="search-heading">Search Shows</h2>
      <form id="search-form">
        <label for="search-input">Enter show name:</label>
        <input type="text" id="search-input" placeholder="e.g., Breaking Bad" required>
        <button type="submit">Search</button>
      </form>
    </section>

    <!-- Results Section -->
    <section class="results-section" aria-labelledby="results-heading">
      <h2 id="results-heading">Search Results</h2>
      <div id="results-grid" class="grid"></div>  <!-- Cards will go here -->
    </section>
  </main>
</body>
</html>
